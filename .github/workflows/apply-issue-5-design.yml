name: Apply issue 5 planning-ref design once

on:
  push:
    branches:
      - design/issue-5-planning-ref
    paths:
      - .github/workflows/apply-issue-5-design.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design/issue-5-planning-ref
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Apply deterministic design patch
        run: python3 .github/tmp/apply-issue-5-design.py

      - name: Verify generated program documentation remains stable
        run: npm run generate:capabilities

      - name: Run full design validation
        run: |
          npm test
          npm run validate:migration
          npm run validate:capabilities
          npm run validate:planning-ref

      - name: Commit final issue 5 candidate and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/apply-issue-5-design.yml
          rm .github/tmp/apply-issue-5-design.py
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: define Epic planning ref publication contract"
          git push origin HEAD:design/issue-5-planning-ref
