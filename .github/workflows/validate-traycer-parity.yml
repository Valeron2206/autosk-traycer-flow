name: Validate program design registries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run adversarial tests
        run: npm test

      - name: Validate Traycer source parity registry
        run: npm run validate:migration

      - name: Validate program capability matrix
        run: npm run validate:capabilities

      - name: Validate Epic planning-ref design contract
        run: npm run validate:planning-ref

      - name: Validate canonical Tickets manifest design contract
        run: npm run validate:tickets-manifest

      - name: Validate project instruction lock design contract
        run: npm run validate:instructions-lock

      - name: Validate project delivery profile design contract
        run: npm run validate:delivery-profile

      - name: Validate artifact registry design contract
        run: npm run validate:artifact-registry

      - name: Validate canonical finding registry design contract
        run: npm run validate:finding-registry

      - name: Validate structured model result design contract
        run: npm run validate:model-result

      - name: Validate Ticket execution base design contract
        run: npm run validate:execution-base

      - name: Validate approved delta integration design contract
        run: npm run validate:approved-delta

      - name: Validate Epic staging design contract
        run: npm run validate:epic-staging

      - name: Validate gate store projection design contract
        run: npm run validate:gate-projection

      - name: Validate clean-room fault matrix design contract
        run: npm run validate:clean-room

      - name: Validate supported platform matrix design contract
        run: npm run validate:platform-support

      - name: Validate signed creation grant design contract
        run: npm run validate:creation-grant

      - name: Validate design candidate and panel attestation
        run: npm run validate:design-candidate

      - name: Validate artifact write receipt contract
        run: npm run validate:artifact-write-receipt

      - name: Validate external source snapshot contract
        run: npm run validate:external-source-snapshot

      - name: Validate evidence manifest contract
        run: npm run validate:evidence-manifest

      - name: Validate governance bundle contract
        run: npm run validate:governance-bundle

      - name: Validate clearance manifest contract
        run: npm run validate:clearance-manifest

      - name: Validate stage carrier matrix
        run: npm run validate:stage-carriers

      - name: Validate provider preflight contract
        run: npm run validate:provider-preflight

      - name: Validate doctor report contract
        run: npm run validate:doctor-report

      - name: Validate human decision contract
        run: npm run validate:human-decision

      - name: Validate verification document contract
        run: npm run validate:verify-doc

      - name: Validate work-type gates contract
        run: npm run validate:work-type-gates

      - name: Validate bounded iteration loop contract
        run: npm run validate:bounded-loop

      - name: Validate requirement revision contract
        run: npm run validate:requirement-revision

      - name: Validate Autobuild run contract
        run: npm run validate:autobuild-run

      - name: Validate Reflect and cost-watch contract
        run: npm run validate:reflect-cost-watch

      - name: Validate Housekeeping contract
        run: npm run validate:housekeeping

      - name: Validate Debate contract
        run: npm run validate:debate

      - name: Validate changeset walkthrough contract
        run: npm run validate:walkthrough

      - name: Validate static analysis gate contract
        run: npm run validate:static-analysis

      - name: Validate SDK write API contract
        run: npm run validate:sdk-write-api

      - name: Validate integration authorization contract
        run: npm run validate:integration-authorization

      - name: Validate material decision manifest contract
        run: npm run validate:material-decisions

      - name: Validate the closed park vocabulary
        run: npm run validate:refusal-vocabulary

      - name: Validate the Arena block contract
        run: npm run validate:arena

      - name: Validate the declarative workflow graph contract
        run: npm run validate:workflow-graph

      # The views are generated from the graph, so this fails two ways on purpose:
      # a table edited in place no longer matches what the document renders, and a
      # document edited without re-rendering no longer matches the table.
      - name: Check the workflow graph's rendered views against their documents
        run: npm run validate:workflow-views

      # The eight chain blocks are hand-drawn and cannot be rendered, so this
      # checks that what they draw the graph can still walk, and that every
      # divergence it tolerates is one somebody wrote down.
      - name: Check section 2's chain blocks against the workflow graph
        run: npm run validate:workflow-chains

      # The lock itself lives in the pinned patch series. This is what notices if
      # a later patch drops it: each requirement is anchored to a line a named
      # patch adds, verified against the digest the manifest already pins.
      - name: Check the patch series still carries the runtime identity lock
        run: npm run validate:runtime-identity-lock

      # The slot names the round-4 anchor pack's members; this re-reads the
      # frozen commit and re-hashes the byte-verifiable ones, so a slot or a
      # round record that drifted from the bytes it claims fails here. The
      # fetch-depth: 0 checkout is what makes the objects readable.
      - name: Check the anchor pack slot against the frozen commit
        run: npm run validate:anchor-pack

      # The membership floor pins a recorded measurement, so the artifact must
      # be regenerated whenever a validator's reads change. This re-runs every
      # validator under the read instrument and fails on any drift — a new
      # input, a removed one, or a reader the artifact does not name.
      - name: Re-measure design inputs and check the recorded set
        run: node scripts/measure-design-inputs.mjs --check

      # The doctor is read-only, so running it in CI costs nothing and proves the
      # command still produces a schema-valid report on a machine that is not the
      # author's. A `fail` here is expected: the runner has no daemon binaries.
      - name: Run the doctor
        run: npm run doctor -- --json > /dev/null || true

      # Every changed path must be governed by a registry class. A path nobody
      # registered does not get the cheapest lifecycle by default; it parks, and
      # the remedy is one registry entry.
      - name: Classify the changeset
        if: github.event_name == 'pull_request'
        run: npm run classify:changeset -- "${{ github.event.pull_request.base.sha }}"

  # The mutation run is the evidence behind "every runtime module was
  # mutation-tested", so it is a command that executes rather than a number in a
  # pull request. It neuters each guard one at a time and re-runs a test file
  # for each, which is too slow to sit in front of every push; it runs on main
  # and on demand, where a survivor nobody named is still caught loudly. A pull
  # request that changes src/host/** pays the same run before merging.
  #
  # The gate is its own job so a pull request that leaves src/host alone reports
  # `mutation` as skipped rather than as a green check that ran nothing. The
  # diff is computed under `set -e` before the decision, so a base SHA that
  # cannot be resolved fails this job instead of silently answering "no host
  # changes". The pathspec does the matching, not the printed text: --name-only
  # quotes paths that need escaping, so a pattern on the output would miss them.
  # --no-renames keeps a module moved out of src/host on the diff.
  host-changes:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.gate.outputs.runs }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the pull request touched src/host
        id: gate
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "pull_request event carried no base SHA" >&2
            exit 1
          fi
          changed="$(git diff --name-only --no-renames "${base}...HEAD" -- src/host/)"
          if [ -n "$changed" ]; then
            echo "runs=true" >> "$GITHUB_OUTPUT"
          else
            echo "runs=false" >> "$GITHUB_OUTPUT"
          fi

  # `!cancelled()` keeps the main and dispatch runs independent of the gate
  # job's health without defeating workflow cancellation: it drops the implicit
  # success() on `needs`, so on those events the ref/event terms decide and a
  # gate-job flake cannot skip them. On pull_request the terms are false, so the
  # gate's output alone decides — and a failed gate still means mutation stays
  # skipped.
  mutation:
    needs: host-changes
    if: "!cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.host-changes.outputs.runs == 'true')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Neuter every guard and re-run its tests
        run: npm run mutation-report
