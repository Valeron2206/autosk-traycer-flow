name: Validate program design registries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Run adversarial tests
        run: npm test

      - name: Validate Traycer source parity registry
        run: npm run validate:migration

      - name: Validate program capability matrix
        run: npm run validate:capabilities

      - name: Validate Epic planning-ref design contract
        run: npm run validate:planning-ref

      - name: Validate canonical Tickets manifest design contract
        run: npm run validate:tickets-manifest

      - name: Validate pull-request file scope
        if: github.event_name == 'pull_request'
        run: npm run validate:scope -- "${{ github.event.pull_request.base.sha }}"
