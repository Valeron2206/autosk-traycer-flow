name: Validate Traycer parity registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run adversarial tests
        run: npm test

      - name: Validate registry
        run: npm run validate:migration

      - name: Validate pull-request file scope
        if: github.event_name == 'pull_request'
        run: npm run validate:scope
