name: Apply capability-matrix hardening once

on:
  push:
    branches:
      - phase-0-issue-capability-matrix
    paths:
      - .github/workflows/apply-capability-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: phase-0-issue-capability-matrix
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Apply verified CodeRabbit fixes
        run: python3 .github/tmp/apply-capability-hardening.py

      - name: Regenerate deterministic documentation
        run: npm run generate:capabilities

      - name: Run full validation suite
        run: |
          npm test
          npm run validate:migration
          npm run validate:capabilities

      - name: Commit hardened candidate and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/apply-capability-hardening.yml
          rm .github/tmp/apply-capability-hardening.py
          rmdir .github/tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(program): harden capability matrix validation"
          git push origin HEAD:phase-0-issue-capability-matrix
