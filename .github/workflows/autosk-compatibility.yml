name: Qualify autosk compatibility patch

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: autosk / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-26
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AUTOSK_NO_AUTO_INSTALL: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set isolated source and binary paths
        run: |
          echo "SOURCE_DIR=$RUNNER_TEMP/autosk-source" >> "$GITHUB_ENV"
          echo "AUTOSKD_BIN=$RUNNER_TEMP/autosk-source/bin/autoskd" >> "$GITHUB_ENV"
          echo "AUTOSK_STORE_LOCK_BIN=$RUNNER_TEMP/autosk-source/bin/autosk-store-lock" >> "$GITHUB_ENV"

      - name: Verify manifest and prepare exact upstream source
        id: source
        run: |
          mkdir -p build/evidence
          node scripts/prepare-autosk.mjs "$SOURCE_DIR" > build/evidence/source-receipt.json
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { loadAutoskManifest } from './scripts/prepare-autosk.mjs';
          const { manifest } = loadAutoskManifest();
          appendFileSync(process.env.GITHUB_OUTPUT, `go=${manifest.toolchains.go}\nbun=${manifest.toolchains.bun}\n`);
          NODE

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.source.outputs.go }}
          cache-dependency-path: ${{ runner.temp }}/autosk-source/go.sum

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.source.outputs.bun }}

      - name: Install frozen dependencies and compile all three binaries
        run: |
          (cd "$SOURCE_DIR/daemon" && bun install --frozen-lockfile)
          (cd "$SOURCE_DIR/pi-tools" && bun install --frozen-lockfile)
          (cd "$SOURCE_DIR" && make build build-store-lock)
          (cd "$SOURCE_DIR/daemon" && bun build --compile core/src/index.ts --outfile ../bin/autoskd)

      - name: Verify installed layout and real crash recovery
        run: |
          node scripts/verify-autosk-creation.mjs "$SOURCE_DIR" > build/evidence/creation-layout.log 2>&1
          node scripts/verify-autosk-crash.mjs "$SOURCE_DIR" > build/evidence/creation-crash.log 2>&1
          node scripts/verify-autosk-visits.mjs "$SOURCE_DIR" > build/evidence/visit-durability.log 2>&1
          node scripts/verify-autosk-graph-digest.mjs "$SOURCE_DIR" > build/evidence/graph-digest.log 2>&1

      - name: Check upstream types and complete test suites
        env:
          GIT_AUTHOR_NAME: Autosk Test
          GIT_AUTHOR_EMAIL: test@autosk.invalid
          GIT_COMMITTER_NAME: Autosk Test
          GIT_COMMITTER_EMAIL: test@autosk.invalid
        run: |
          (cd "$SOURCE_DIR/daemon" && bun run typecheck) > build/evidence/typecheck.log 2>&1
          (cd "$SOURCE_DIR/daemon" && env -u AUTOSK_NO_AUTO_INSTALL bun test) > build/evidence/bun-test.log 2>&1
          (cd "$SOURCE_DIR" && go test -json -count=1 ./...) > build/evidence/go-test.jsonl 2>&1
          (cd "$SOURCE_DIR" && go test -race -count=1 ./internal/storelock ./cmd/autosk-store-lock) > build/evidence/native-race.log 2>&1
          (cd "$SOURCE_DIR/pi-tools" && bun run typecheck) > build/evidence/pi-typecheck.log 2>&1
          (cd "$SOURCE_DIR/pi-tools" && bun test) > build/evidence/pi-test.log 2>&1

      - name: Verify upstream test summaries
        run: |
          node scripts/verify-autosk-tests.mjs \
            --bun build/evidence/bun-test.log \
            --go build/evidence/go-test.jsonl \
            --pi build/evidence/pi-test.log \
            --output build/evidence/test-summary.json

      - name: Record verified source and binary identities
        run: |
          mkdir -p build/package/bin build/artifacts
          cp "$SOURCE_DIR/bin/autosk" "$SOURCE_DIR/bin/autoskd" "$SOURCE_DIR/bin/autosk-store-lock" build/package/bin/
          cp compat/autosk/LICENSE build/package/LICENSE
          cp compat/autosk/manifest.v1.json build/package/compatibility-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          import { loadAutoskManifest } from './scripts/prepare-autosk.mjs';
          const { manifest, manifestSha256 } = loadAutoskManifest();
          const git = (...args) => execFileSync('git', args, { cwd: process.env.SOURCE_DIR, encoding: 'utf8' }).trim();
          assert.equal(git('write-tree'), manifest.result_tree);
          git('diff', '--quiet');
          git('diff', '--cached', '--check');
          const source = JSON.parse(readFileSync('build/evidence/source-receipt.json', 'utf8'));
          assert.equal(source.manifest_sha256, manifestSha256);
          assert.equal(source.source_tree, manifest.result_tree);
          const testSummary = JSON.parse(readFileSync('build/evidence/test-summary.json', 'utf8'));
          assert.equal(testSummary.schema_version, 1);
          assert.equal(testSummary.status, 'passed');
          const files = ['bin/autosk', 'bin/autoskd', 'bin/autosk-store-lock', 'LICENSE', 'compatibility-manifest.json'].map(path => {
            const bytes = readFileSync(`build/package/${path}`);
            if (path.startsWith('bin/')) assert.ok(statSync(`build/package/${path}`).mode & 0o111);
            return { path, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          const receipt = { schema_version: 1, source, repository_commit: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID, platform: process.platform, arch: process.arch,
            toolchains: { node: process.version, bun: execFileSync('bun', ['--version'], { encoding: 'utf8' }).trim(),
              go: execFileSync('go', ['version'], { encoding: 'utf8' }).trim() }, test_summary: testSummary, files };
          writeFileSync('build/package/build-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`, { flag: 'wx' });
          NODE
          tar -czf "build/artifacts/autosk-compat-${{ matrix.target }}.tar.gz" -C build/package .
          (cd build/artifacts && shasum -a 256 "autosk-compat-${{ matrix.target }}.tar.gz" > "autosk-compat-${{ matrix.target }}.tar.gz.sha256")

      - name: Upload verified development bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: autosk-compat-${{ matrix.target }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: autosk-evidence-${{ matrix.target }}
          path: build/evidence/*
          if-no-files-found: warn
          retention-days: 14
